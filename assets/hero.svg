<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Leo Vesin — AI Research and Engineering</title>
  <desc id="desc">Professional GitHub profile banner for Leo Vesin, focused on machine learning, information retrieval, recommender systems and optimisation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#101d33"/>
      <stop offset="100%" stop-color="#0a2a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>

  <circle cx="1015" cy="74" r="72" fill="#22c55e" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1090" cy="214" r="96" fill="#38bdf8" opacity="0.09" filter="url(#soft)"/>

  <g stroke="#5eead4" stroke-opacity="0.5" fill="none">
    <path d="M930 86 L1015 58 L1090 102 L1040 178 L950 166 Z" stroke-width="2"/>
    <path d="M950 166 L1015 58 L1040 178 L1090 102" stroke-width="1.4" stroke-opacity="0.35"/>
    <circle cx="930" cy="86" r="5" fill="#5eead4"/>
    <circle cx="1015" cy="58" r="5" fill="#5eead4"/>
    <circle cx="1090" cy="102" r="5" fill="#5eead4"/>
    <circle cx="1040" cy="178" r="5" fill="#5eead4"/>
    <circle cx="950" cy="166" r="5" fill="#5eead4"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="92" fill="#99f6e4" font-size="20" font-weight="700" letter-spacing="4">AI RESEARCH · ML ENGINEERING</text>
    <text x="68" y="166" fill="#f8fafc" font-size="64" font-weight="800" letter-spacing="-1">Leo Vesin</text>
    <text x="72" y="210" fill="#cbd5e1" font-size="23" font-weight="500">Building measurable, reproducible intelligent systems.</text>
    <text x="72" y="256" fill="#94a3b8" font-size="17" font-weight="600" letter-spacing="1.4">QUBO · INFORMATION RETRIEVAL · RECOMMENDER SYSTEMS · CONVERSATIONAL AI</text>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
